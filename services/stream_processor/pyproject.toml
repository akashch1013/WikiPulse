[project]
name = "wikipulse-stream-processor"
version = "0.1.0"
description = "Deduplication, bronze sink and event-time window aggregation of page_change events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "psycopg[binary]==3.3.6",
    "quixstreams==3.28.1",
    "wikipulse-common",
]

[tool.uv.sources]
wikipulse-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wikipulse_stream"
