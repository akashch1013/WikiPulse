[project]
name = "wikipulse-api"
version = "0.1.0"
description = "Read-only REST API over WikiPulse serving tables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "uvicorn==0.54.0",
    "wikipulse-common",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
wikipulse-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
