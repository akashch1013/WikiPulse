[project]
name = "wikipulse-common"
version = "0.1.0"
description = "Shared configuration, logging, HTTP, Kafka and telemetry code for WikiPulse services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic-settings==2.16.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
