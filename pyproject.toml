[project]
name = "wikipulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/ingest", "services/stream_processor", "services/api", "orchestration"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
    "jsonschema",
    "psycopg[binary]",
]
docs = [
    "zensical==0.0.73",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wikipulse_common", "wikipulse_ingest", "wikipulse_stream", "wikipulse_api", "wikipulse_orchestration"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
